<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealtimeIRL Combined Overlay</title>
  <style>
    :root {
      --overlay-height: 56px;
      --gap: 15px;
      --time-width: 140px;
      --date-width: 200px;
      --temp-width: 120px;
      --location-width: 600px;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      overflow: hidden;
    }

    .overlay-wrap {
      display: flex;
      align-items: center;
      gap: var(--gap);
      height: var(--overlay-height);
    }

    iframe {
      height: var(--overlay-height);
      border: 0;
      background: transparent;
      flex: 0 0 auto;
    }

    #time { width: var(--time-width); }
    #date { width: var(--date-width); }
    #temperature { width: var(--temp-width); }
    #location { width: var(--location-width); }
  </style>
</head>
<body>

  <div class="overlay-wrap">
    <!-- The 'src' attributes start empty and are filled by the script below -->
    <iframe id="time" scrolling="no"></iframe>
    <iframe id="date" scrolling="no"></iframe>
    <iframe id="temperature" scrolling="no"></iframe>
    <iframe id="location" scrolling="no"></iframe>
  </div>

  <script>
    // 1. Automatically detect your actual local time zone
    const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    console.log("Detected Time Zone:", userTimeZone);

    // 2. Base URLs and CSS strings
    const commonCSS = "Zm9udC1mYW1pbHk6ICdQb3BwaW5zJywgc2Fucy1zZXJpZiAhaW1wb3J0YW50Owpmb250LXNpemU6IDI2cHg7CmZvbnQtd2VpZ2h0OiA2MDA7CmNvbG9yOiAjZmZmZmZmOwp0ZXh0LXNoYWRvdzogMHB4IDJweCA2cHggcmdiYSgwLCAwLCAwLCAwLjUpOwpsaW5lLWhlaWdodDogMS4yOwp3aGl0ZS1zcGFjZTogbm93cmFwOw==";
    const commonFont = "aHR0cHM6Ly9mb250cy5nb29nbGVhcGlzLmNvbS9jc3MyP2ZhbWlseT1Qb3BwaW5zJmRpc3BsYXk9c3dhcA==";

    // 3. Update the iframes with the correct Time Zone parameter
    document.getElementById('time').src = `https://overlays.rtirl.com/datetime/luxon.html?key=rm0qb5jr0qtis39f&lang=en&format=hh:mm%20a&zone=${userTimeZone}&css=${commonCSS}&font=${commonFont}`;
    
    document.getElementById('date').src = `https://overlays.rtirl.com/datetime/luxon.html?key=rm0qb5jr0qtis39f&lang=en&format=DD&zone=${userTimeZone}&css=${commonCSS}&font=${commonFont}`;
    
    document.getElementById('temperature').src = `https://overlays.rtirl.com/weather/temperature/F.html?key=rm0qb5jr0qtis39f&css=${commonCSS}&font=${commonFont}`;
    
    document.getElementById('location').src = `https://overlays.rtirl.com/neighborhood.html?key=7smpbf8kh2mxwwcf&lang=en&format=%24%7Bdata.neighborhood%20%3F%20data.neighborhood.text%20%2B%20'%2C%20'%20%3A%20''%7D%24%7Bdata.place%20%3F%20data.place.text%20%3A%20''%7D&css=${commonCSS}&font=${commonFont}`;
  </script>

</body>
</html>
