<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealtimeIRL Combined Overlay</title>

  <style>
    :root {
      --overlay-height: 56px;
      --gap: 15px; /* Added slight gap for better readability */

      --time-width: 140px;
      --date-width: 200px;
      --temp-width: 120px;
      --location-width: 600px;
      --distance-width: 220px;
      --speed-width: 160px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .overlay-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: var(--gap);
      height: var(--overlay-height);
      box-sizing: border-box;
      background: transparent;
      flex-wrap: nowrap;
      width: 100%;
    }

    iframe {
      display: block;
      height: var(--overlay-height);
      border: 0;
      background: transparent;
      overflow: hidden;
      flex: 0 0 auto;
    }

    /* Width assignments */
    #time { flex: 0 0 var(--time-width); width: var(--time-width); }
    #date { flex: 0 0 var(--date-width); width: var(--date-width); }
    #temperature { flex: 0 0 var(--temp-width); width: var(--temp-width); }
    #location { flex: 0 0 var(--location-width); width: var(--location-width); }
    #distance { flex: 0 0 var(--distance-width); width: var(--distance-width); }
    #speed { flex: 0 0 var(--speed-width); width: var(--speed-width); }
    
  </style>
</head>
