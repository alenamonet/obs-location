  <style>
    :root {
      /* Height increased slightly to accommodate the larger 30px font */
      --overlay-height: 65px; 
      --gap: 25px;

      --time-width: 200px;
      --date-width: 220px;
      --temp-width: 150px;
      --location-width: 600px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .overlay-wrap {
      display: flex;
      align-items: center;
      gap: var(--gap);
      height: var(--overlay-height);
    }

    iframe {
      display: block;
      height: var(--overlay-height);
      border: 0;
      background: transparent;
      overflow: hidden;
      flex: 0 0 auto;
    }

    #time { width: var(--time-width); }
    #date { width: var(--date-width); }
    #temperature { width: var(--temp-width); }
    #location { width: var(--location-width); }
  </style>
</head>
